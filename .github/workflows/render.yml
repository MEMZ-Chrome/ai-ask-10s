name: Render video

# 手动触发，或每次推送到 main 时渲染一遍。
# 产物（MP4）会作为 workflow artifact 上传，可直接在 Actions 页面下载。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    name: Render AiAnswer10s.mp4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Remotion 在 Linux CI 上需要 Chromium 的系统依赖。
      - name: Install Chrome dependencies
        run: npx remotion browser ensure --with-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render MP4
        run: npx remotion render AiAnswer10s out/AiAnswer10s.mp4 --codec=h264 --crf=18

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: AiAnswer10s-mp4
          path: out/AiAnswer10s.mp4
          retention-days: 30
          if-no-files-found: error
